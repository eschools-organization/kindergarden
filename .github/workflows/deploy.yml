name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy bg via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.SERVER_USER || secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || secrets.SSH_PORT || 22 }}
          script: |
            cd /var/www/html/bg
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            npm install
            npm run build
            pm2 restart bg

      - name: Deploy anbanela via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || secrets.SSH_HOST }}
          username: ${{ secrets.SERVER_USER || secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || secrets.SSH_PORT || 22 }}
          script: |
            cd /var/www/html/anbanela
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            npm install
            npm run build
            pm2 restart anbanela
